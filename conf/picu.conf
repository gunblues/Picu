server {
    location ~ /.well-known {
        allow all;
    }
    include snippets/ssl-picu.app.conf;
    include snippets/ssl-params.conf;
    listen 443 ssl http2;
    listen 80;
    server_name picu.app;
    index index.php;
    root /home/kevin/git/picu;
    access_log /var/log/nginx/picu-access.log;
    error_log /var/log/nginx/picu-error.log;
    location / {
        index index.php index.html index.htm;
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php {
        fastcgi_pass unix:/var/run/php/php7.0-fpm.sock;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* /(conf|\.git|\.env|composer\.json|composer\.lock|package\.json|package-lock\.json|postbuild\.js|rev-manifest\.json|vite\.config\.js) {
	    return 302 /;
	}

    if (!-e $request_filename) {
        rewrite ^/(.*)  /index.php?$1 last;
    }

}
